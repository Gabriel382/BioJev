run_name: bioqwen-smoke
seed: 42
output_dir: outputs/bioqwen/smoke_b4a4_nogc

model:
  base_model: Qwen/Qwen3.5-4B-Base

corpus:
  token_budget: 50000
  sequence_length: 1024
  shuffle: true
  add_eos_between_documents: true
  sources:
    - name: pubmed
      dataset: slinusc/PubMedAbstractsSubset
      split: train
      weight: 0.8
      title_field: title
      abstract_field: abstract
      id_field: PMID
      min_chars: 100
      shuffle_buffer: 2000
    - name: pmc
      dataset: aochongoliverli/pmc_openaccess_split
      split: main
      trust_remote_code: false
      weight: 0.2
      text_field: text
      id_field: pmid
      commercial_only: true
      skip_retracted: true
      min_chars: 300
      shuffle_buffer: 1000

training:
  method: qlora
  mixed_precision: bfloat16
  per_device_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-5
  weight_decay: 0.1
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  gradient_checkpointing: false
  optimizer: adamw_torch
  logging_steps: 1
  save_steps: 25
  save_total_limit: 2
  dataloader_num_workers: 0
  report_to: [tensorboard]
  tf32: true
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules: all-linear
