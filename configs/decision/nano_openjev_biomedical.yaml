run_name: biojev-nano-openjev-biomedical
seed: 42
output_dir: outputs/biojev/nano_openjev_biomedical
model:
  initialization: openjev
  repo_id: AlexWortega/openjev
  subfolder: qwen3.5-0.8b-nli-v5
  max_length: 512
training:
  method: qlora
  mixed_precision: auto
  per_device_batch_size: 4
  eval_batch_size: 8
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.03
  gradient_checkpointing: false
  logging_steps: 10
  eval_steps: 100
  save_steps: 100
  save_total_limit: 2
  report_to: [tensorboard]
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules: all-linear
stages:
  - name: biomedical
    epochs: 1
    max_length: 512
    epoch_examples: 40000
    datasets:
      - name: bionli
        weight: 0.75
      - name: nli4ct
        weight: 0.25
