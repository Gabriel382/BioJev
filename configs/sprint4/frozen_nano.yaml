name: sprint4-frozen-nano
output_root: results/sprint4/frozen_nano
seed: 42
models:
  - name: qwen35-08b-base
    config: configs/models/qwen35_08b_base_likelihood.yaml
    batch_size: 2
  - name: openjev-08b
    config: configs/models/openjev_nano_v5.yaml
    batch_size: 8
  - name: biojev-nano
    config: configs/models/biojev_nano_local.yaml
    batch_size: 8
datasets:
  - name: bionli
    split: test
    role: held_out_from_single_split
  - name: nli4ct
    split: dev
    role: validation_seen_during_full_training
  - name: chemprot
    split: test
    role: zero_shot_relation_typing
  - name: ddi2013
    split: test
    role: zero_shot_relation_typing
  - name: biored
    split: test
    role: zero_shot_relation_typing
